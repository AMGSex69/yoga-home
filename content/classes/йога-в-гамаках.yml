title: Йога в гамаках
type: группа
cost: от 400 р
description: "Йога в гамаках  — направление, сочетающее элементы традиционной
  йоги, фитнеса и акробатики. Главное отличие от традиционной йоги —
  использование специального подвесного гамака из прочной эластичной ткани,
  закреплённого к потолку. Гамак берёт часть нагрузки на себя, позволяя легче
  входить в сложные положения и удерживать их дольше без лишнего напряжения. "
duration: 1ч
